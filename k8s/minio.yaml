apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weathergpt-minio
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: object-store
spec:
  serviceName: weathergpt-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weathergpt
      app.kubernetes.io/component: object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weathergpt
        app.kubernetes.io/component: object-store
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address ":9001"
          ports:
            - containerPort: 9000
              name: s3-api
            - containerPort: 9001
              name: s3-console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: weathergpt-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weathergpt-secrets
                  key: MINIO_SECRET_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: miniodata
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: miniodata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-minio
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: object-store
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: s3-api
    - port: 9001
      targetPort: 9001
      name: s3-console
  selector:
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: object-store
