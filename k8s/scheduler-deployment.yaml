apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-scheduler
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: ingestion-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weathergpt
      app.kubernetes.io/component: ingestion-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weathergpt
        app.kubernetes.io/component: ingestion-scheduler
    spec:
      containers:
        - name: scheduler
          image: weathergpt-api:latest
          imagePullPolicy: IfNotPresent
          command: ["entrypoint.sh", "worker"]
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
