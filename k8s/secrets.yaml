apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
  labels:
    app.kubernetes.io/name: weathergpt
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials and asyncpg connection string
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres_production_secret@weathergpt-postgres:5432/weathergpt"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_production_secret"
  POSTGRES_DB: "weathergpt"

  # MinIO credentials
  MINIO_ACCESS_KEY: "minioadmin_access_key"
  MINIO_SECRET_KEY: "minioadmin_secret_key"

  # LLM & Voice API keys
  LLM_API_KEY: "gsk_groq_production_key_placeholder"
  BHASHINI_API_KEY: "bhashini_api_key_placeholder"
  BHASHINI_USER_ID: "bhashini_user_id_placeholder"
  BHASHINI_INFERENCE_KEY: "bhashini_inference_key_placeholder"
