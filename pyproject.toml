[project]
name = "weathergpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- API Gateway ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",

    # --- Grid Data & GRIB ---
    "xarray>=2026.7.0",
    "zarr>=3.3.0",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.48.0",
    "netcdf4>=1.7.4",
    "scipy>=1.18.1",

    # --- GRIB Fetch ---
    "herbie-data>=2026.3.0",
    "ecmwf-opendata>=0.3.34",

    # --- Database & Geospatial (PostGIS + TimescaleDB) ---
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "geoalchemy2>=0.20.0",
    "alembic>=1.19.1",

    # --- Cache ---
    "redis>=8.1.0",

    # --- Object Store ---
    "minio>=7.2.20",
    "boto3>=1.43.83",

    # --- LLM Orchestrator ---
    "litellm>=1.98.0",

    # --- Realtime (MQTT in, WebSocket out) ---
    "paho-mqtt>=2.1.0",
    "aiohttp>=3.14.3",

    # --- Push Notifications ---
    "firebase-admin>=7.5.0",

    # --- Ingestion / Scheduling ---
    "apscheduler>=3.11.3",
